name: Bundle local sentence encoder
on:
  push:
    branches: [main]
    paths: ['.github/workflows/bundle-encoder.yml']
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned official model and verify checksum
        run: |
          python3 - <<'PYTHON'
          import hashlib
          from pathlib import Path
          import urllib.request
          path = Path("models/all-MiniLM-L6-v2/model.safetensors")
          expected = "53aa51172d142c89d9012cce15ae4d6cc0ca6895895114379cacb4fab128d9db"
          url = "https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/c9745ed1d9f207416be6d2e6f8de32d1f16199bf/model.safetensors"
          if not path.exists():
              urllib.request.urlretrieve(url, path)
          assert hashlib.sha256(path.read_bytes()).hexdigest() == expected, "Model checksum mismatch"
          print("Verified official encoder:", path.stat().st_size, "bytes")
          PYTHON
      - name: Commit verified model
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add models/all-MiniLM-L6-v2/model.safetensors
          if ! git diff --cached --quiet; then
            git commit -m "Bundle verified all-MiniLM-L6-v2 encoder weights"
            git push origin HEAD:main
          fi
